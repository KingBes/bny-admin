<!-- 步骤2：数据库配置 -->
<div class="step-panel" id="step-2">
    <div class="form-result" id="db-result">
        <notempty name="error"><span class="badge" style="color:var(--red)">{$error}</span></notempty>
    </div>
    <form hx-ext="bny-form" hx-post="{:url('install.index.register_sql')}" hx-target="#step-2"
        hx-swap="outerHTML">
        <div class="form-item">
            <label>主机地址</label>
            <div class="input-group">
                <input class="bny-input" name="hostname" value="{$form.hostname|default='127.0.0.1'}" required
                    valid-msg-required="请填写数据库主机地址">
            </div>
        </div>
        <div class="form-item">
            <label>端口</label>
            <div class="input-group">
                <input class="bny-input" name="port" value="{$form.port|default='3306'}" required
                    valid-msg-required="请填写数据库端口">
            </div>
        </div>
        <div class="form-item">
            <label>数据库名</label>
            <div class="bny-input-group">
                <input class="bny-input" name="database" placeholder="不存在将自动创建" required valid-msg-required="请填写数据库名"
                    value="{$form.database|default='bny_admin'}">
            </div>
        </div>
        <div class="form-item">
            <label>用户名</label>
            <div class="input-group">
                <input class="bny-input" name="username" value="{$form.username|default='root'}"
                    required valid-msg-required="请填写数据库用户名">
            </div>
        </div>
        <div class="form-item">
            <label>密码</label>
            <div class="input-group">
                <input class="bny-input" name="password" type="password" placeholder="数据库密码（无密码可留空）"
                    value="{$form.password|default=''}">
            </div>
        </div>
        <div class="form-item">
            <label>表前缀</label>
            <div class="input-group">
                <input class="bny-input" name="prefix" value="{$form.prefix|default='bny_'}" required
                    valid-msg-required="请填写表前缀">
            </div>
        </div>
        <div class="step-actions">
            <button type="button" class="bny-btn" btn-color="blue"
                hx-get="{:url('install.index.check_env')}" hx-swap="outerHTML" hx-target="#step-2">上一步</button>
            <button type="submit" class="bny-btn">下一步</button>
        </div>
    </form>
</div>
