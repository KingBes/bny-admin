<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安装向导 - BnyAdmin</title>
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <!-- 主题：记忆 > 系统偏好 > 亮色兜底 -->
    <script>
        (function () {
            var t;
            try { t = localStorage.getItem('bny-theme'); } catch (e) { }
            if (!t) {
                t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            }
            if (t === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
    <!-- bunny.ui -->
    <link rel="stylesheet" href="/bunny/bunny.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background-color: var(--gray-shallow);
            color: var(--black);
        }

        /* ===== 右上角主题切换 ===== */
        .install-theme-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border: 1px solid var(--gray-shallow);
            border-radius: var(--border-radius);
            background: var(--white);
            color: var(--black-middle);
            cursor: pointer;
            transition: var(--transition);
        }

        .install-theme-btn:hover {
            border-color: var(--default-shallow);
            background: var(--white-shallow);
        }

        html.dark .icon-sun {
            display: inline-block;
        }

        html.dark .icon-moon {
            display: none;
        }

        html:not(.dark) .icon-sun {
            display: none;
        }

        html:not(.dark) .icon-moon {
            display: inline-block;
        }

        /* ===== 页面容器与品牌区 ===== */
        .install-wrap {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 16px 64px;
        }

        .install-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 26px;
        }

        .install-brand .logo {
            width: 46px;
            height: 46px;
            border-radius: var(--border-radius);
        }

        .install-brand h1 {
            margin: 0;
            font-size: var(--font-size-24);
            line-height: var(--line-height-heading);
            color: var(--black);
        }

        .install-brand p {
            margin: 2px 0 0;
            font-size: var(--font-size-sm);
            color: var(--black-shallow);
        }

        /* ===== 卡片 ===== */
        .install-card {
            padding: 30px 36px 26px;
        }

        /* ===== 自研步骤条（状态由容器类 step-1..step-4 纯 CSS 控制）===== */
        .install-steps {
            display: flex;
            margin-bottom: 30px;
        }

        .install-steps .step {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        /* 连接线：位于相邻两个圆点之间 */
        .install-steps .step:not(:first-child)::before {
            content: '';
            position: absolute;
            top: 14px;
            left: calc(-50% + 21px);
            right: calc(50% + 21px);
            height: 2px;
            background: var(--gray-middle);
            transition: var(--transition);
        }

        .install-steps .dot {
            position: relative;
            z-index: 1;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-semibold);
            background: var(--white);
            color: var(--black-shallow);
            border: 2px solid var(--gray-middle);
            transition: var(--transition);
        }

        .install-steps .dot .ok {
            display: none;
        }

        .install-steps .label {
            font-size: var(--font-size-sm);
            color: var(--black-shallow);
        }

        /* 已完成步骤：连接线与圆点变绿，圆点显示对勾 */
        .install-steps.step-2 .step:nth-child(-n+1)::before,
        .install-steps.step-3 .step:nth-child(-n+2)::before,
        .install-steps.step-4 .step:nth-child(-n+3)::before {
            background: var(--green);
        }

        .install-steps.step-2 .step:nth-child(-n+1) .dot,
        .install-steps.step-3 .step:nth-child(-n+2) .dot,
        .install-steps.step-4 .step:nth-child(-n+3) .dot {
            background: var(--green);
            border-color: var(--green);
            color: var(--white-common);
        }

        .install-steps.step-2 .step:nth-child(-n+1) .dot .num,
        .install-steps.step-3 .step:nth-child(-n+2) .dot .num,
        .install-steps.step-4 .step:nth-child(-n+3) .dot .num {
            display: none;
        }

        .install-steps.step-2 .step:nth-child(-n+1) .dot .ok,
        .install-steps.step-3 .step:nth-child(-n+2) .dot .ok,
        .install-steps.step-4 .step:nth-child(-n+3) .dot .ok {
            display: inline;
        }

        /* 当前步骤：主题蓝高亮 */
        .install-steps.step-1 .step:nth-child(1) .dot,
        .install-steps.step-2 .step:nth-child(2) .dot,
        .install-steps.step-3 .step:nth-child(3) .dot,
        .install-steps.step-4 .step:nth-child(4) .dot {
            background: var(--blue);
            border-color: var(--blue);
            color: var(--white-common);
            box-shadow: 0 0 0 4px var(--blue-alpha-10);
        }

        .install-steps.step-1 .step:nth-child(1) .label,
        .install-steps.step-2 .step:nth-child(2) .label,
        .install-steps.step-3 .step:nth-child(3) .label,
        .install-steps.step-4 .step:nth-child(4) .label {
            color: var(--black);
            font-weight: var(--font-weight-semibold);
        }

        /* ===== 步骤面板与操作区 ===== */
        .step-panel {
            margin-top: 4px;
        }

        .step-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid var(--gray-shallow);
        }

        .form-result {
            margin-bottom: 14px;
        }

        /* ===== 环境检查列表 ===== */
        .env-loading {
            text-align: center;
            padding: 28px 0;
            color: var(--black-shallow);
        }

        .env-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .env-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border: 1px solid var(--gray-shallow);
            border-radius: var(--border-radius);
            background: var(--white-middle);
        }

        .env-item .name {
            font-weight: var(--font-weight-medium);
            color: var(--black);
        }

        .env-item .msg {
            flex: 1;
            font-size: var(--font-size-sm);
            color: var(--black-shallow);
        }

        .env-item .badge {
            font-size: var(--font-size-xs);
            padding: 2px 10px;
            border-radius: var(--border-radius-full);
            white-space: nowrap;
        }

        .env-item.ok .badge {
            color: var(--green);
            background: var(--green-alpha-10);
        }

        .env-item.fail .badge {
            color: var(--red);
            background: var(--red-alpha-10);
        }

        .env-item.fail {
            border-color: var(--red-shallow);
        }

        .env-tip {
            margin-top: 14px;
            font-size: var(--font-size-sm);
            color: var(--red);
        }

        /* ===== 完成页 ===== */
        .install-done {
            text-align: center;
            padding: 26px 0 8px;
        }

        .install-done .done-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--green);
            color: var(--white-common);
            font-size: 36px;
            font-weight: var(--font-weight-bold);
            margin-bottom: 18px;
        }

        .install-done h2 {
            margin: 0 0 10px;
            color: var(--black);
        }

        .install-done p {
            margin: 0 0 26px;
            color: var(--black-shallow);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .install-wrap {
                padding-top: 32px;
            }

            .install-card {
                padding: 22px 18px 18px;
            }

            .install-brand h1 {
                font-size: var(--font-size-20);
            }

            .install-steps .label {
                font-size: var(--font-size-xs);
            }
        }
    </style>
</head>

<body>
    <!-- 右上角明暗切换 -->
    <button class="install-theme-btn" id="theme-toggle" type="button" title="切换主题">
        <i class="bny-icon icon-bulb-fill icon-sun"></i>
        <i class="bny-icon icon-bulb icon-moon"></i>
    </button>

    <div class="install-wrap">
        <!-- 品牌区 -->
        <div class="install-brand">
            <img class="logo" src="/icon.png" alt="BnyAdmin">
            <div>
                <h1>安装向导</h1>
                <p>BnyAdmin 后台管理系统 · 按步骤完成初始化</p>
            </div>
        </div>

        <div class="bny-card install-card">
            <!-- 自研步骤条：容器类 step-1..step-4 控制状态 -->
            <div class="install-steps step-1" id="install-steps">
                <div class="step">
                    <span class="dot"><span class="num">1</span><span class="ok">✓</span></span>
                    <span class="label">环境检查</span>
                </div>
                <div class="step">
                    <span class="dot"><span class="num">2</span><span class="ok">✓</span></span>
                    <span class="label">数据库配置</span>
                </div>
                <div class="step">
                    <span class="dot"><span class="num">3</span><span class="ok">✓</span></span>
                    <span class="label">注册管理员</span>
                </div>
                <div class="step">
                    <span class="dot"><span class="num">4</span><span class="ok">✓</span></span>
                    <span class="label">完成</span>
                </div>
            </div>

            <!-- 步骤1：环境检查 -->
            <div class="step-panel" id="step-1">
                <div id="env-box" hx-get="/install/env" hx-trigger="load" hx-swap="none">
                    <div class="env-loading">正在检查服务器环境…</div>
                </div>
                <div class="step-actions">
                    <button type="button" class="bny-btn" id="btn-next-1" disabled>下一步</button>
                </div>
            </div>

            <!-- 步骤2：数据库配置 -->
            <div class="step-panel" id="step-2" hidden>
                <div class="form-result" id="db-result"></div>
                <form id="db-form" hx-ext="bny-form bny-validate" hx-post="/install/testdb"
                    hx-swap="none">
                    <input type="hidden" name="token" value="{:bny_token()}">
                    <div class="form-item">
                        <label>主机地址</label>
                        <div class="input-group">
                            <input class="bny-input" name="hostname" value="127.0.0.1" required
                                valid-msg-required="请填写数据库主机地址">
                        </div>
                    </div>
                    <div class="form-item">
                        <label>端口</label>
                        <div class="input-group">
                            <input class="bny-input" name="port" value="3306" required
                                valid-msg-required="请填写数据库端口">
                        </div>
                    </div>
                    <div class="form-item">
                        <label>数据库名</label>
                        <div class="bny-input-group">
                            <input class="bny-input" name="database" placeholder="不存在将自动创建" required
                                valid-msg-required="请填写数据库名" value="bny_admin">
                        </div>
                    </div>
                    <div class="form-item">
                        <label>用户名</label>
                        <div class="input-group">
                            <input class="bny-input" name="username" value="root" required
                                valid-msg-required="请填写数据库用户名">
                        </div>
                    </div>
                    <div class="form-item">
                        <label>密码</label>
                        <div class="input-group">
                            <input class="bny-input" name="password" type="password"
                                placeholder="数据库密码（无密码可留空）">
                        </div>
                    </div>
                    <div class="form-item">
                        <label>表前缀</label>
                        <div class="input-group">
                            <input class="bny-input" name="prefix" value="bny_" required
                                valid-msg-required="请填写表前缀">
                        </div>
                    </div>
                    <div class="step-actions">
                        <button type="button" class="bny-btn" btn-color="blue" data-prev="1">上一步</button>
                        <button type="submit" class="bny-btn" btn-color="green">测试连接并初始化数据表</button>
                        <button type="button" class="bny-btn" id="btn-next-2" disabled>下一步</button>
                    </div>
                </form>
            </div>

            <!-- 步骤3：注册超级管理员 -->
            <div class="step-panel" id="step-3" hidden>
                <div class="form-result" id="admin-result"></div>
                <form id="admin-form" hx-ext="bny-form bny-validate" hx-post="/install/create"
                    hx-swap="none">
                    <input type="hidden" name="token" value="{:bny_token()}">
                    <div class="form-item">
                        <label>管理员用户名</label>
                        <div class="input-group">
                            <input class="bny-input" name="username" placeholder="3-32 位字母、数字、下划线或连字符" required
                                valid-rules="regexp:/^[A-Za-z0-9_-]{3,32}$/"
                                valid-msg-required="请填写管理员用户名"
                                valid-msg-regexp="用户名须为 3-32 位字母、数字、下划线或连字符">
                        </div>
                    </div>
                    <div class="form-item">
                        <label>管理员密码</label>
                        <div class="input-group">
                            <input class="bny-input" name="password" type="password" minlength="6" required
                                valid-msg-required="请填写管理员密码" valid-msg-min="密码长度不能少于 6 位">
                        </div>
                    </div>
                    <div class="form-item">
                        <label>确认密码</label>
                        <div class="input-group">
                            <input class="bny-input" name="confirm_password" type="password" required
                                valid-rules="equals:password"
                                valid-msg-required="请再次填写管理员密码"
                                valid-msg-equals="两次输入的密码不一致">
                        </div>
                    </div>
                    <div class="form-item">
                        <label>站点名称</label>
                        <div class="input-group">
                            <input class="bny-input" name="site_name" value="BnyAdmin 后台">
                        </div>
                    </div>
                    <div class="step-actions">
                        <button type="button" class="bny-btn" btn-color="blue" data-prev="2">上一步</button>
                        <button type="submit" class="bny-btn" btn-color="green">注册并完成安装</button>
                    </div>
                </form>
            </div>

            <!-- 步骤4：完成 -->
            <div class="step-panel" id="step-4" hidden>
                <div class="install-done">
                    <div class="done-icon">✓</div>
                    <h2>安装完成</h2>
                    <p>已创建管理员账号与默认站点配置，权限节点已同步。<br>点击下方按钮前往登录页，使用刚注册的管理员账号登录后台。</p>
                    <button type="button" class="bny-btn" btn-color="blue"
                        onclick="location.href='/admin/passport/login'">前往登录</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/bunny/bunny.js"></script>
    <script>
        /**
         * 安装向导单页交互
         * 步骤切换 + 环境检查渲染 + 数据库/账号表单提交（htmx 提交，JSON 响应统一处理）
         */
        (function () {
            // 当前步骤
            var current = 1;
            // 数据库是否已初始化（控制步骤2的"下一步"）
            var dbDone = false;

            /**
             * 切换到指定步骤（1-4）：面板显隐 + 步骤条容器类
             */
            window.goStep = function (n) {
                n = Math.max(1, Math.min(4, n));
                current = n;
                for (var i = 1; i <= 4; i++) {
                    var panel = document.getElementById('step-' + i);
                    if (panel) panel.hidden = (i !== n);
                }
                var steps = document.getElementById('install-steps');
                if (steps) steps.className = 'install-steps step-' + n;
            };

            /**
             * 渲染环境检查列表，全部通过才允许进入下一步
             */
            function renderEnv(items) {
                var html = '<div class="env-list">';
                var allOk = true;
                items.forEach(function (item) {
                    if (!item.ok) allOk = false;
                    html += '<div class="env-item ' + (item.ok ? 'ok' : 'fail') + '">'
                        + '<span class="name">' + bny.escapeChars(item.name || '') + '</span>'
                        + '<span class="msg">' + bny.escapeChars(item.msg || '') + '</span>'
                        + '<span class="badge">' + (item.ok ? '通过' : '未通过') + '</span>'
                        + '</div>';
                });
                html += '</div>';
                if (!allOk) {
                    html += '<div class="env-tip">存在未通过的检查项，请先处理后再继续安装</div>';
                }
                document.getElementById('env-box').innerHTML = html;
                document.getElementById('btn-next-1').disabled = !allOk;
            }

            /**
             * 在指定结果区显示绿/红提示
             */
            function showResult(id, ok, msg) {
                var box = document.getElementById(id);
                if (!box) return;
                box.innerHTML = '<div class="bny-alert" alert-color="' + (ok ? 'green' : 'red') + '">'
                    + bny.escapeChars(msg || '') + '</div>';
            }

            /**
             * 解析 JSON 响应
             */
            function parseJson(xhr) {
                try {
                    return JSON.parse(xhr.responseText);
                } catch (e) {
                    return null;
                }
            }

            // 提交时禁用按钮防止重复提交
            document.body.addEventListener('htmx:beforeRequest', function (e) {
                var elt = e.detail.elt || e.detail.element;
                if (elt && elt.querySelector) {
                    var submitBtn = elt.querySelector('button[type="submit"]');
                    if (submitBtn) submitBtn.disabled = true;
                }
            });

            // htmx 请求完成后统一分发处理
            document.body.addEventListener('htmx:afterRequest', function (e) {
                var elt = e.detail.elt || e.detail.element;
                var xhr = e.detail.xhr;
                if (!elt || !xhr) return;

                // 提交按钮恢复可用
                var submitBtn = elt.querySelector ? elt.querySelector('button[type="submit"]') : null;
                if (submitBtn) submitBtn.disabled = false;

                if (e.detail.failed) {
                    if (elt.id === 'env-box') {
                        document.getElementById('env-box').innerHTML =
                            '<div class="env-loading">环境检查请求失败，请刷新重试</div>';
                    } else if (elt.id === 'db-form') {
                        showResult('db-result', false, '请求失败（HTTP ' + xhr.status + '），请重试');
                    } else if (elt.id === 'admin-form') {
                        showResult('admin-result', false, '请求失败（HTTP ' + xhr.status + '），请重试');
                    }
                    return;
                }

                if (elt.id === 'env-box') {
                    var envData = parseJson(xhr);
                    if (!envData || !envData.items) {
                        document.getElementById('env-box').innerHTML =
                            '<div class="env-loading">环境检查失败，请刷新重试</div>';
                        return;
                    }
                    renderEnv(envData.items);
                } else if (elt.id === 'db-form') {
                    var dbData = parseJson(xhr);
                    if (dbData && dbData.ok) {
                        dbDone = true;
                        showResult('db-result', true, dbData.msg || '连接成功，数据表与基础数据已初始化');
                        document.getElementById('btn-next-2').disabled = false;
                    } else {
                        dbDone = false;
                        document.getElementById('btn-next-2').disabled = true;
                        showResult('db-result', false, (dbData && dbData.msg) || '数据库连接失败，请检查后重试');
                    }
                } else if (elt.id === 'admin-form') {
                    var adminData = parseJson(xhr);
                    if (adminData && adminData.ok) {
                        goStep(4);
                    } else {
                        showResult('admin-result', false, (adminData && adminData.msg) || '安装失败，请重试');
                    }
                }
            });

            // 步骤1「下一步」
            document.getElementById('btn-next-1').addEventListener('click', function () {
                if (!this.disabled) goStep(2);
            });

            // 步骤2「下一步」（数据库初始化成功后可用）
            document.getElementById('btn-next-2').addEventListener('click', function () {
                if (!this.disabled && dbDone) goStep(3);
            });

            // 「上一步」按钮
            Array.prototype.forEach.call(document.querySelectorAll('button[data-prev]'), function (btn) {
                btn.addEventListener('click', function () {
                    goStep(parseInt(this.getAttribute('data-prev'), 10) || 1);
                });
            });

            // 主题切换
            document.getElementById('theme-toggle').addEventListener('click', function () {
                var isDark = document.documentElement.classList.toggle('dark');
                try { localStorage.setItem('bny-theme', isDark ? 'dark' : 'light'); } catch (e) { }
            });
        })();
    </script>
</body>

</html>
