<div class="admin-page">
    <div class="bny-card">
        <div class="head">
            <span><i class="bny-icon icon-attachment"></i> 附件管理</span>
        </div>
        <div class="body">
            <!-- 工具栏 -->
            <div class="flex-between flex-wrap" style="gap:12px;margin-bottom:12px">
                <!-- 左侧：全选 + 批量操作 -->
                <div class="flex items-center flex-wrap" style="gap:12px">
                    <button class="bny-btn" btn-model="border" hx-ext="bny-attr"
                        hx-target="all #table-attachment input[name='id[]']" attr-toggle="checked">
                        全选/反选
                    </button>
                    <button class="bny-btn" btn-model="border" btn-color="red" hx-ext="bny-confirm" hx-confirm="确认删除吗？"
                        confirm-yes="bny.tableReload('#table-attachment')" hx-get="{:url('admin.attachment.delete')}"
                        hx-include="#table-attachment input[name='id[]']:checked">
                        <i class="bny-icon icon-delete"></i> 批量删除
                    </button>
                </div>
                <!-- 右侧：搜索 + 上传 -->
                <div class="flex items-center flex-wrap" style="gap:12px">
                    <input class="bny-input" type="text" name="name" placeholder="搜索名称"
                        style="width:220px;max-width:100%" hx-ext="bny-table" hx-post="{:url('admin.attachment.view')}"
                        hx-target="#table-attachment tbody" hx-swap="innerHTML" hx-trigger="input changed delay:400ms"
                        hx-include="closest div" />
                    <button class="bny-btn" hx-ext="bny-upload,bny-alert" btn-model="border"
                        hx-post="{:url('admin.attachment.upload')}"
                        alert-fn="if(data.code==0){bny.tableReload('#table-attachment')}">
                        <i class="bny-icon icon-upload"></i> 上传附件
                    </button>
                </div>
            </div>

            <!-- 表格 -->
            <table hx-ext="bny-table" id="table-attachment" table-static table-server table-key="attachment"
                hx-post="{:url('admin.attachment.view')}" hx-trigger="load" hx-target="find tbody" hx-swap="innerHTML"
                table-list="10,50,100">
                <thead>
                    <tr>
                        <th cell-field="id" width="80" cell-template=".tpl-admin-id">ID</th>
                        <th cell-field="name" cell-sort>名称</th>
                        <th cell-field="url" cell-template=".tpl-admin-url">路径</th>
                        <th cell-field="create_time" cell-sort>创建时间</th>
                        <th cell-field="update_time" cell-sort>更新时间</th>
                        <th cell-template=".tpl-admin-operation">操作</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <!-- ID模板 -->
            <template class="tpl-admin-id">
                <label>
                    <input type="checkbox" name="id[]" class="bny-checkbox" value="{{data.id}}">
                </label>
            </template>
            <!-- 图片模板 -->
            <template class="tpl-admin-url">
                <img src="{{data.url}}" height="26" img-preview img-preview-group="table-group">
            </template>
            <!-- 操作模板 -->
            <template class="tpl-admin-operation">
                <button hx-ext="bny-confirm" hx-confirm="确认删除吗？"
                    hx-get="{:url('admin.attachment.delete')}?id[]={{data.id}}"
                    confirm-yes="bny.tableReload('#table-attachment')" class="bny-btn" btn-model="border"
                    btn-color="red">删除</button>
            </template>
        </div>
    </div>
</div>
