<!-- 附件选择/上传弹层：选项卡切换 -->
<div class="attach-finder">
    <div hx-ext="bny-tab" tab-index="0">
        <ul class="head">
            <li class="this">上传文件</li>
            <li>选择附件</li>
        </ul>
        <div class="body">
            <!-- 页签：上传文件 -->
            <div class="show">
                <div class="upload-box" id="upload-box" data-target="{$target}" data-type="{$type}" data-max="{$max}"
                    data-upload-url="{:url('admin.attachment.upload')}">
                    <!-- 压缩选项（始终显示，选了文件后自动压缩上传） -->
                    <div class="upload-compress">
                        <label class="upload-compress-switch">
                            <input type="checkbox" class="bny-switch" id="compress-enable" />
                            <span>压缩图片</span>
                        </label>
                        <div class="upload-compress-level">
                            <label for="compress-level">压缩强度</label>
                            <input type="range" id="compress-level" min="1" max="10" value="3" />
                            <b id="compress-level-val">3</b>
                        </div>
                        <button class="bny-btn" id="upload-confirm" type="button" btn-color="blue" disabled>确定</button>
                    </div>

                    <!-- 选择区：点击或拖拽 -->
                    <div class="upload-drop" id="upload-drop">
                        <input type="file" id="upload-input" multiple hidden />
                        <i class="bny-icon icon-upload"></i>
                        <p class="upload-drop-title">点击选择或拖拽文件到此处</p>
                        <p class="upload-drop-tip">支持图片、文档、压缩包等格式，可一次选择多个</p>
                    </div>

                    <!-- 已选文件列表（自动压缩上传） -->
                    <div class="upload-files" id="upload-files"></div>

                    <!-- 操作区 -->
                    <div class="upload-actions">
                        <span class="upload-count" id="upload-count">尚未选择文件</span>
                    </div>

                    <!-- 结果列表 -->
                    <div class="upload-result" id="upload-result"></div>
                </div>
            </div>
            <!-- 页签：选择附件 -->
            <div>
                <div class="attach-select" id="attach-select">
                    <!-- 工具栏：搜索 + 全选 + 计数 + 确认 -->
                    <div class="attach-toolbar">
                        <input type="hidden" name="type" value="{$type}" />
                        <input type="hidden" name="target" value="{$target}" />
                        <input type="hidden" name="max" value="{$max}" />
                        <div class="bny-input-group attach-search">
                            <span class="bny-input-prefix"><i class="bny-icon icon-search"></i></span>
                            <!-- 纯输入框：搜索由 bny-attach 扩展监听（防抖） -->
                            <input class="bny-input" id="attach-search" type="text" placeholder="搜索文件名"
                                name="name" />
                        </div>
                        <label class="attach-all">
                            <input type="checkbox" class="bny-checkbox" id="attach-all" />
                            <span>全选</span>
                        </label>
                        <span class="attach-count"><i class="bny-icon icon-check-circle"></i> 已选 <b
                                id="attach-count">0</b></span>
                        <button class="bny-btn" id="attach-confirm" type="button" btn-color="blue">确认选择</button>
                    </div>

                    <!-- 附件网格：由 bny-attach 扩展接管（滚动加载 + 搜索）
                 hx-trigger="none" 禁用 hx-post 默认的 click 触发，请求统一由扩展发起 -->
                    <div class="attach-grid" id="attach-grid"
                        hx-ext="bny-attach"
                        hx-post="{:url('admin.attachment.select')}"
                        hx-trigger="none"
                        attach-search="#attach-search"></div>
                </div>
            </div>
        </div>
    </div>
</div>
