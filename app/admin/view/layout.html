<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{$title|default='KLLXS 管理后台'}</title>
    <link rel="shortcut icon" href="bunny.png" type="image/x-icon">
    <!-- 主题：记忆 > 系统偏好 > 亮色兜底 -->
    <script>
        (function () {
            var t;
            try { t = localStorage.getItem('bny-theme'); } catch (e) { }
            if (!t) {
                t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            }
            if (t === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
    <!-- bunny.ui -->
    <link rel="stylesheet" href="/bunny/bunny.css">
    <!-- 自定义 -->
    <link rel="stylesheet" href="/admin/css/site.css">
</head>

<body>

    <div class="admin-layout">

        <!-- 侧边导航 -->
        <aside class="admin-side" hx-get="{:url('admin.index.menu',['toggle'=>'true'])}" hx-trigger="load"></aside>

        <!-- 主内容区 -->
        <div class="admin-main">
            <!-- 顶栏 -->
            <header class="admin-topbar">
                <div class="admin-topbar-left">
                    <button class="admin-menu-btn" hx-ext="bny-page" hx-get="{:url('admin.index.menu')}"
                        hx-trigger="click" page-width="240px" page-height="100%" title="false" page-anim="left"
                        page-offset="left" spa-skip page-shade title="展开菜单">
                        <i class="bny-icon icon-menu"></i>
                    </button>
                    <a class="admin-top-btn" href="/" target="_blank" tip="前台">
                        <i class="bny-icon icon-dribbble"></i>
                    </a>
                </div>
                <div class="admin-actions">
                    <button class="admin-theme-btn" id="theme-toggle" spa-skip title="切换主题">
                        <i class="bny-icon icon-bulb-fill icon-sun"></i>
                        <i class="bny-icon icon-bulb icon-moon"></i>
                    </button>
                    <div hx-ext="bny-dropdown">
                        <button class="admin-user-btn" spa-skip>
                            <i class="bny-icon icon-user"></i>
                            <span>管理员</span>
                        </button>
                        <div class="bny-dropdown">
                            <div style="padding:6px">
                                <a class="trigger" href="javascript:void(0)"
                                    style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--border-radius-sm);color:var(--black-middle);text-decoration:none">
                                    <i class="bny-icon icon-user"></i><span>个人中心</span>
                                </a>
                                <a class="trigger" href="/admin/login"
                                    style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--border-radius-sm);color:var(--black-middle);text-decoration:none">
                                    <i class="bny-icon icon-setting"></i><span>退出登录</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- 多页签内容区 -->
            <main class="admin-content">
                <div class="admin-tabs" id="admin-tabs" hx-ext="bny-tab" tab-mode="scroll" tab-index="0">
                    <ul class="head">
                        <li class="this" data-url="/admin" data-title="仪表盘">仪表盘</li>
                    </ul>
                    <div class="body">
                        <div class="show">{__CONTENT__}</div>
                    </div>
                </div>
                <div class="admin-tap">
                    Bny.ui 后台管理系统
                </div>
            </main>

        </div>
    </div>

    <script src="/bunny/bunny.js"></script>

    <!-- 主题切换 -->
    <script>
        document.getElementById('theme-toggle').addEventListener('click', function () {
            var isDark = document.documentElement.classList.toggle('dark');
            try { localStorage.setItem('bny-theme', isDark ? 'dark' : 'light'); } catch (e) { }
        });
    </script>

    <!-- 多页签：菜单点击打开/切换标签 + 标签与侧边菜单双向联动 -->
    <script>
        (function () {
            function adminOpenTab(url, title) {
                if (!url) return;
                var tab = document.getElementById('admin-tabs');
                if (!tab || !htmx) return;
                var head = tab.querySelector('.head');
                // 已打开：切换到该标签
                var lis = head.querySelectorAll('li');
                for (var i = 0; i < lis.length; i++) {
                    if (lis[i].getAttribute('data-url') === url) {
                        lis[i].click();
                        return;
                    }
                }
                // 新增标签
                var li = document.createElement('li');
                li.setAttribute('hx-get', url);
                li.setAttribute('tab-closable', '');
                li.setAttribute('this', '');
                li.setAttribute('data-url', url);
                li.textContent = title || '页面';
                head.appendChild(li);
                htmx.process(li);
            }
            // 同步侧边菜单高亮：将匹配 url 的菜单项置 active，其余移除
            function syncMenu(url) {
                if (!url) return;
                var side = document.querySelector('.admin-side [nav-side]');
                if (!side) return;
                var links = side.querySelectorAll('[admin-tab]');
                for (var i = 0; i < links.length; i++) {
                    if (links[i].getAttribute('data-url') === url) {
                        links[i].classList.add('active');
                    } else {
                        links[i].classList.remove('active');
                    }
                }
            }
            // 侧边菜单委托：仅处理标记了 admin-tab 的叶子链接
            document.addEventListener('click', function (e) {
                var link = e.target.closest('[admin-tab]');
                if (!link) return;
                e.preventDefault();
                adminOpenTab(link.getAttribute('data-url'), link.getAttribute('data-title'));
            });
            // 标签切换 → 同步侧边菜单高亮
            var tabs = document.getElementById('admin-tabs');
            if (tabs) {
                tabs.addEventListener('click', function (e) {
                    var li = e.target.closest('.head > li');
                    if (li) syncMenu(li.getAttribute('data-url'));
                });
            }
            // 侧边菜单加载完成后，同步当前选中标签对应的菜单高亮
            var aside = document.querySelector('.admin-side');
            if (aside) {
                aside.addEventListener('htmx:afterSwap', function () {
                    var act = document.querySelector('#admin-tabs .head > li.this');
                    if (act) syncMenu(act.getAttribute('data-url'));
                });
            }

            // ===== 多页签状态持久化：刷新后恢复打开的标签与当前选中 =====
            function saveTabs() {
                var tab = document.getElementById('admin-tabs');
                if (!tab) return;
                var head = tab.querySelector('.head');
                var open = [], active = '';
                var lis = head.querySelectorAll('li');
                for (var i = 0; i < lis.length; i++) {
                    var u = lis[i].getAttribute('data-url');
                    if (!u) continue;
                    open.push({ url: u, title: (lis[i].textContent || '').replace(/\s+/g, ' ').trim() });
                    if (lis[i].classList.contains('this')) active = u;
                }
                try { sessionStorage.setItem('admin-tabs', JSON.stringify({ open: open, active: active })); } catch (e) { }
            }

            function restoreTabs() {
                var tab = document.getElementById('admin-tabs');
                if (!tab || !htmx) return;
                var head = tab.querySelector('.head');
                var data;
                try { data = JSON.parse(sessionStorage.getItem('admin-tabs')); } catch (e) { }
                if (!data || !data.open || !data.open.length) return;
                var existing = {};
                var lis = head.querySelectorAll('li');
                for (var i = 0; i < lis.length; i++) existing[lis[i].getAttribute('data-url')] = 1;
                // 重建打开过的标签（内容懒加载，点击才请求）
                data.open.forEach(function (t) {
                    if (existing[t.url]) return;
                    var li = document.createElement('li');
                    li.setAttribute('hx-get', t.url);
                    li.setAttribute('tab-closable', '');
                    li.setAttribute('data-url', t.url);
                    li.textContent = t.title || '页面';
                    head.appendChild(li);
                    htmx.process(li);
                });
                // 激活上次选中的标签
                var target = null;
                var lis2 = head.querySelectorAll('li');
                for (var j = 0; j < lis2.length; j++) {
                    if (lis2[j].getAttribute('data-url') === data.active) target = lis2[j];
                }
                if (target) target.click();
            }

            // 监听标签增删/切换，自动保存状态（带防抖）
            if (tabs) {
                var head = tabs.querySelector('.head');
                var timer = null;
                if (window.MutationObserver && head) {
                    new MutationObserver(function () {
                        clearTimeout(timer);
                        timer = setTimeout(saveTabs, 200);
                    }).observe(head, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
                }
            }

            // 页面完全加载后再恢复（确保 htmx/bny-tab 已完成初始化）
            if (document.readyState === 'complete') setTimeout(restoreTabs, 0);
            else window.addEventListener('load', function () { setTimeout(restoreTabs, 0); });
        })();
    </script>

</body>

</html>
