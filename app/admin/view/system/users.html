<div class="admin-page">
    <div class="bny-card">
        <div class="head">
            <span><i class="bny-icon icon-user"></i> 用户管理</span>
        </div>
        <div class="body">
            <table class="bny-table" hx-ext="bny-table" table-key="admin-users">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>用户名</th>
                        <th>邮箱</th>
                        <th>角色</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <volist name="list" id="item">
                    <tr>
                        <td>{$item.id}</td>
                        <td>{$item.name}</td>
                        <td>{$item.email}</td>
                        <td>{$item.role}</td>
                        <td>{$item.status}</td>
                        <td class="bny-table-ops">
                            <a href="javascript:void(0)">编辑</a>
                            <a href="javascript:void(0)" class="danger">删除</a>
                        </td>
                    </tr>
                    </volist>
                </tbody>
            </table>
        </div>
    </div>
</div>
