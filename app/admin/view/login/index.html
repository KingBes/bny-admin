<!-- 头部 -->
<include file="public/head" />
<!-- 右上角明暗切换 -->
<button class="auth-theme-btn" id="theme-toggle" type="button" title="切换主题">
    <i class="bny-icon icon-bulb-fill icon-sun"></i>
    <i class="bny-icon icon-bulb icon-moon"></i>
</button>

<div class="auth">
    <!-- 左侧品牌区 -->
    <aside class="auth-aside">
        <div class="auth-brand">
            <span class="brand-icon"><img src="/icon.png" alt="BnyAdmin"></span>
            <b>BnyAdmin</b>
        </div>
        <div class="auth-aside-body">
            <h1>专注业务，简洁高效</h1>
            <p>开箱即用的后台管理框架，基于 ThinkPHP 8 与 bunny-ui 构建，助你快速搭建稳健的后台系统。</p>
        </div>
        <div class="auth-aside-foot">© 2026 BnyAdmin</div>
    </aside>

    <!-- 右侧表单区 -->
    <main class="auth-main" hx-ext="bny-alert,bny-url">
        <div class="auth-panel">
            <div class="auth-head">
                <h2>欢迎登录</h2>
                <p>请使用管理员账号登录后台</p>
            </div>

            <!-- 登录表单 -->
            <form class="auth-form" hx-ext="bny-form bny-url" hx-post="{:url('admin.login.login')}" hx-swap="none">
                <div class="form-item">
                    <label for="login-username">用户名</label>
                    <div class="bny-input-group" form-size="lg">
                        <span class="bny-input-prefix"><i class="bny-icon icon-user"></i></span>
                        <input class="bny-input" id="login-username" name="username" placeholder="请输入用户名"
                            autocomplete="username" required value="{$form.username|default=''}"
                            valid-msg-required="请输入用户名">
                    </div>
                </div>
                <div class="form-item">
                    <label for="login-password">密码</label>
                    <div class="bny-input-group" form-size="lg">
                        <span class="bny-input-prefix"><i class="bny-icon icon-lock"></i></span>
                        <input class="bny-input" id="login-password" name="password" type="password" placeholder="请输入密码"
                            autocomplete="current-password" minlength="6" required value="{$form.password|default=''}"
                            valid-msg-required="请输入密码" valid-msg-min="密码长度不能少于 6 位">
                        <span class="bny-input-suffix" id="pwd-toggle" style="cursor:pointer" title="显示/隐藏密码">
                            <i class="bny-icon icon-eye"></i>
                        </span>
                    </div>
                </div>

                <div class="form-item">
                    <label for="login-password">验证</label>
                    <div class="bny-input-group" form-size="lg">
                        <span class="bny-input-prefix"><i class="bny-icon icon-safetycertificate-f"></i></span>
                        <input class="bny-input" id="login-password" name="captcha" type="text" placeholder="请输入验证码"
                            required valid-msg-required="请输入验证码">
                        <a href="javascript:;">
                            <img src="{:url('admin.login.captcha')}" alt="captcha"
                                onclick="this.src=`{:url('admin.login.captcha')}`+`?${Math.random()}`">
                        </a>
                    </div>
                </div>

                <div class="auth-extra">
                    <label>
                        <input type="checkbox" name="remember" class="bny-checkbox" value="1" {$form.remember
                            ? 'checked' : '' } />
                        <span>记住我</span>
                    </label>
                </div>

                <div class="auth-submit">
                    <button type="submit" class="bny-btn">登 录</button>
                </div>
            </form>

            <div class="auth-foot">BnyAdmin 后台管理系统</div>
        </div>
    </main>
</div>
<script>
    // 检测路径是否在登录页面，如果不是登录页面，重定向到登录页面
    (function () {
        const thenUrl = `{:url('admin.login.index')}`;
        if (window.location.pathname !== thenUrl) {
            window.location.href = thenUrl;
        }
    })();

    // 密码显示/隐藏
    (function () {
        var toggle = document.getElementById('pwd-toggle');
        var input = document.getElementById('login-password');
        var icon = toggle ? toggle.querySelector('i') : null;
        if (!toggle || !input || !icon) return;
        toggle.addEventListener('click', function () {
            var shown = input.type === 'text';
            input.type = shown ? 'password' : 'text';
            icon.className = 'bny-icon ' + (shown ? 'icon-eye' : 'icon-eye-close');
        });
    })();
</script>
<!-- 底部 -->
<include file="public/foot" />
