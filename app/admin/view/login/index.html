<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - BnyAdmin 后台</title>
    <link rel="shortcut icon" href="/icon.png" type="image/x-icon">
    <!-- 主题：记忆 > 系统偏好 > 亮色兜底 -->
    <script>
        (function () {
            var t;
            try { t = localStorage.getItem('bny-theme'); } catch (e) { }
            if (!t) {
                t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            }
            if (t === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
    <!-- bunny.ui -->
    <link rel="stylesheet" href="/bunny/bunny.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background-color: var(--white-shallow);
            color: var(--black);
            font-size: var(--font-size);
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 双栏布局：左品牌 + 右表单 ===== */
        .auth {
            min-height: 100vh;
            display: flex;
        }

        /* ---- 左侧品牌区（温暖中性，留白克制） ---- */
        .auth-aside {
            position: relative;
            flex: 1 1 44%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 52px 56px;
            overflow: hidden;
            color: var(--white);
            background:
                radial-gradient(120% 120% at 100% 0%, var(--default-middle) 0%, transparent 55%),
                linear-gradient(155deg, var(--default) 0%, var(--default-middle) 100%);
        }

        /* 极淡的品牌点缀圆，克制不抢眼 */
        .auth-aside::after {
            content: '';
            position: absolute;
            width: 420px;
            height: 420px;
            right: -160px;
            bottom: -160px;
            border-radius: 50%;
            border: 1px solid var(--white-alpha-12);
            background: radial-gradient(circle, var(--white-alpha-08), transparent 70%);
        }

        .auth-brand {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .auth-brand img {
            width: 28px;
            height: 28px;
        }

        .auth-brand .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            border-radius: 13px;
            background: var(--white-common);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.16);
        }

        .auth-brand b {
            font-size: var(--font-size-24);
            font-weight: var(--font-weight-semibold);
            letter-spacing: 0.5px;
        }

        .auth-aside-body {
            position: relative;
            z-index: 1;
            max-width: 420px;
        }

        .auth-aside-body h1 {
            margin: 0 0 16px;
            font-size: 30px;
            font-weight: var(--font-weight-bold);
            line-height: 1.35;
            letter-spacing: -0.01em;
            color: var(--white);
        }

        .auth-aside-body p {
            margin: 0;
            font-size: var(--font-size);
            line-height: 1.8;
            color: var(--white-alpha-85);
        }

        .auth-aside-foot {
            position: relative;
            z-index: 1;
            font-size: var(--font-size-xs);
            color: var(--white-alpha-50);
        }

        /* ---- 右侧表单区 ---- */
        .auth-main {
            flex: 1 1 56%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 32px;
        }

        .auth-panel {
            width: 100%;
            max-width: 400px;
            padding: 40px 40px 32px;
            background: var(--white);
            border: 1px solid var(--black-alpha-05);
            border-radius: var(--border-radius-15);
            box-shadow: var(--box-shadow-055);
            transition: var(--transition);
        }

        .auth-head {
            margin-bottom: 32px;
        }

        .auth-head h2 {
            margin: 0 0 10px;
            font-size: 24px;
            font-weight: var(--font-weight-bold);
            letter-spacing: -0.01em;
            color: var(--black);
        }

        .auth-head p {
            margin: 0;
            font-size: var(--font-size-sm);
            color: var(--black-shallow);
        }

        /* 错误提示（克制） */
        .auth-result {
            margin-bottom: 20px;
        }

        .auth-result .badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: var(--font-size-xs);
            padding: 9px 12px;
            border-radius: var(--border-radius);
            color: var(--red);
            background: var(--red-alpha-10);
            border: 1px solid var(--red-shallow);
        }

        /* 表单 */
        .auth-form .form-item {
            margin-bottom: 20px;
        }

        .auth-form label {
            display: block;
            margin-bottom: 8px;
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            color: var(--black);
        }

        /* 让输入框撑满输入组高度，与前后缀对齐，不压缩其样式 */
        .auth-form .bny-input-group .bny-input {
            height: 100%;
        }

        .auth-extra {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 2px 0 24px;
        }

        .auth-extra label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin: 0;
            cursor: pointer;
            font-size: var(--font-size-sm);
            color: var(--black-middle);
        }

        .auth-submit {
            margin-top: 4px;
        }

        .auth-submit .bny-btn {
            width: 100%;
            height: 44px;
            font-size: var(--font-size);
            letter-spacing: 1px;
            font-weight: var(--font-weight-medium);
        }

        .auth-foot {
            margin-top: 28px;
            text-align: center;
            font-size: var(--font-size-xs);
            color: var(--black-shallow);
        }

        /* ===== 右上角主题切换 ===== */
        .auth-theme-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border: 1px solid var(--black-alpha-08);
            border-radius: var(--border-radius);
            background: var(--white);
            color: var(--black-middle);
            cursor: pointer;
            transition: var(--transition);
        }

        .auth-theme-btn:hover {
            border-color: var(--default-shallow);
            color: var(--default);
        }

        html.dark .icon-sun {
            display: inline-block;
        }

        html.dark .icon-moon {
            display: none;
        }

        html:not(.dark) .icon-sun {
            display: none;
        }

        html:not(.dark) .icon-moon {
            display: inline-block;
        }

        /* ===== 响应式：窄屏隐藏左侧品牌区 ===== */
        @media (max-width: 900px) {
            .auth-aside {
                display: none;
            }

            .auth-main {
                padding: 40px 24px;
            }
        }
    </style>
</head>

<body>
    <!-- 右上角明暗切换 -->
    <button class="auth-theme-btn" id="theme-toggle" type="button" title="切换主题">
        <i class="bny-icon icon-bulb-fill icon-sun"></i>
        <i class="bny-icon icon-bulb icon-moon"></i>
    </button>

    <div class="auth">
        <!-- 左侧品牌区 -->
        <aside class="auth-aside">
            <div class="auth-brand">
                <span class="brand-icon"><img src="/icon.png" alt="BnyAdmin"></span>
                <b>BnyAdmin</b>
            </div>
            <div class="auth-aside-body">
                <h1>专注业务，简洁高效</h1>
                <p>开箱即用的后台管理框架，基于 ThinkPHP 8 与 bunny-ui 构建，助你快速搭建稳健的后台系统。</p>
            </div>
            <div class="auth-aside-foot">© 2026 BnyAdmin</div>
        </aside>

        <!-- 右侧表单区 -->
        <main class="auth-main">
            <div class="auth-panel">
                <div class="auth-head">
                    <h2>欢迎登录</h2>
                    <p>请使用管理员账号登录后台</p>
                </div>

                <!-- 登录表单 -->
                <form class="auth-form" hx-ext="bny-form" hx-post="{:url('/admin/login/login')}" hx-swap="none">
                    <div class="form-item">
                        <label for="login-username">用户名</label>
                        <div class="bny-input-group" form-size="lg">
                            <span class="bny-input-prefix"><i class="bny-icon icon-user"></i></span>
                            <input class="bny-input" id="login-username" name="username" placeholder="请输入用户名"
                                autocomplete="username" required value="{$form.username|default=''}"
                                valid-msg-required="请输入用户名">
                        </div>
                    </div>
                    <div class="form-item">
                        <label for="login-password">密码</label>
                        <div class="bny-input-group" form-size="lg">
                            <span class="bny-input-prefix"><i class="bny-icon icon-lock"></i></span>
                            <input class="bny-input" id="login-password" name="password" type="password"
                                placeholder="请输入密码" autocomplete="current-password" minlength="6" required
                                value="{$form.password|default=''}" valid-msg-required="请输入密码"
                                valid-msg-min="密码长度不能少于 6 位">
                            <span class="bny-input-suffix" id="pwd-toggle" style="cursor:pointer" title="显示/隐藏密码">
                                <i class="bny-icon icon-eye"></i>
                            </span>
                        </div>
                    </div>

                    <div class="auth-extra">
                        <label>
                            <input type="checkbox" name="remember" class="bny-checkbox">
                            <span>记住我</span>
                        </label>
                    </div>

                    <div class="auth-submit">
                        <button type="submit" class="bny-btn">登 录</button>
                    </div>
                </form>

                <div class="auth-foot">BnyAdmin 后台管理系统</div>
            </div>
        </main>
    </div>

    <script src="/bunny/bunny.js"></script>
    <script>
        // 主题切换
        document.getElementById('theme-toggle').addEventListener('click', function () {
            var isDark = document.documentElement.classList.toggle('dark');
            try { localStorage.setItem('bny-theme', isDark ? 'dark' : 'light'); } catch (e) { }
        });

        // 密码显示/隐藏
        (function () {
            var toggle = document.getElementById('pwd-toggle');
            var input = document.getElementById('login-password');
            var icon = toggle ? toggle.querySelector('i') : null;
            if (!toggle || !input || !icon) return;
            toggle.addEventListener('click', function () {
                var shown = input.type === 'text';
                input.type = shown ? 'password' : 'text';
                icon.className = 'bny-icon ' + (shown ? 'icon-eye' : 'icon-eye-close');
            });
        })();
    </script>
</body>

</html>
